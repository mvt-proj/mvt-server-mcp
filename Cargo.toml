[package]
name = "mvt-server-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
rmcp = { version = "3.7.0", features = ["server", "macros", "transport-io"] }
schemars = "1.0"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "io-std"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls-native-certs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
config = "0.15"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
wiremock = "0.6"
